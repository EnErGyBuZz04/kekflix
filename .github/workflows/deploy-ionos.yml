# Deploy della build su IONOS (hosting statico, nginx).
#
# Non parte da solo finché i tre secrets non esistono: si avvia a mano da
# Actions → Deploy su IONOS → Run workflow. Secrets da creare in
# Settings → Secrets and variables → Actions:
#
#   FTP_SERVER    host FTP IONOS (es. access-xxxxx.webspace-data.io)
#   FTP_USERNAME  utente FTP
#   FTP_PASSWORD  password FTP
#   FTP_DIR       (facoltativo) cartella del sito, default "/"
#
# Carica solo i file cambiati e non cancella nulla di ciò che trova sul server.

name: Deploy su IONOS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Verifica i secrets FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "Secrets FTP mancanti: niente deploy (build comunque verificata)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # Rigenera lo snapshot del catalogo vixsrc, poi compila
      - run: npm run catalog
      - run: npm run build

      - name: Upload su IONOS
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR || '/' }}
